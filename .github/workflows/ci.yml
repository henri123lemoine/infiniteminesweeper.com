name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-and-frontend:
    name: Backend and Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.0

      - name: Generate Go protobufs
        run: |
          mkdir -p backend/gen
          protoc --go_out=backend/gen --go_opt=paths=source_relative proto/messages.proto

      - name: Prepare embed assets
        run: |
          mkdir -p backend/dist
          echo placeholder > backend/dist/.keep

      - name: Run Go tests
        env:
          RUN_COMPRESSION_BENCH: "0"
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend checks
        run: |
          node frontend/tests/run-frontend-tests.mjs
          node frontend/tests/unit-helpers.mjs
