name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate Go protobufs
        run: |
          protoc --go_out=. \
            --go_opt=module=github.com/henri123lemoine/infiniteminesweeper.com \
            --go_opt=Mproto/messages.proto=github.com/henri123lemoine/infiniteminesweeper.com/backend/gen/proto \
            proto/messages.proto

      - name: Seed backend dist for embed
        run: |
          mkdir -p backend/dist
          echo '<!doctype html><title>ci</title>' > backend/dist/index.html

      - name: Run Go tests
        run: go test ./backend/... -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend checks
        run: |
          node frontend/tests/run-frontend-tests.mjs
          node frontend/tests/unit-helpers.mjs
