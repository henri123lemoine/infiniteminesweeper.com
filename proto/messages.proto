syntax = "proto3";
package ms;
option go_package = "github.com/henri123lemoine/infiniteminesweeper.com/proto";

// ---- Core Data Structures ----

// Client state in the finite state machine
enum ClientState {
  SPECTATOR = 0; // Can only view, no game actions
  PLAYER = 1;    // Full game capabilities
}

message ChunkID {
  sint64 X = 1;
  sint64 Y = 2;
}

message ScoreUpdate {
  sint32 score = 1; // The player's new total score.
  sint32 delta = 2; // The amount the score just changed by.
  // The world position where the primary score change occurred.
  ChunkID chunkId = 3;
  uint32 cell = 4;
}

message RevealedCells {
  repeated uint32 cells = 1;
}

// ---- Client -> Server Messages ----


// Subscribes the client to real-time updates for a specific chunk.
message Subscribe {
  ChunkID chunkId = 1;
}

// Unsubscribes the client from a chunk.
message Unsubscribe {
  ChunkID chunkId = 1;
}

// The unified message for all primary player game actions.
message Reveal {
  // A client-generated ID for this specific action, used for reconciliation.
  uint64 request_id = 1;

  // Position of the user's click.
  ChunkID chunkId = 2;
  uint32 cell = 3;

  // The user's intent. These are mutually exclusive from a logic standpoint.
  bool is_right_click = 4; // User wants to place a flag.
  bool is_chord = 5; // User wants to perform a chord reveal.
}

// Informs the server of the client's current viewport center.
message ViewUpdate {
  ChunkID chunkId = 1;
  uint32 cell = 2;
  // Dimensions of the visible area in world cells (not pixels), so the server
  // can scale the region proportionally to the user's viewport.
  uint32 widthCells = 3;
  uint32 heightCells = 4;
}

// Transition from SPECTATOR to PLAYER state by joining the game.
message Join {
  // The player's chosen name and flag style.
  string name = 1;
  uint32 flagID = 2;
  // Optional session token for reconnecting to existing identity
  string sessionToken = 3;
}

// Update player profile (name/flag) while remaining in PLAYER state.
message UpdateProfile {
  string name = 1;
  uint32 flagID = 2;
}

// ---- Server -> Client Messages ----


message FlagGroup {
  uint32 flagID = 1;
  RevealedCells cells = 2; // List of cell indices with this flag style.
}

// Contains the full state required to render a single chunk.
message ChunkSync {
  ChunkID chunkId = 1;
  bytes seed = 2; // The deterministic seed for mine generation.
  bytes reveals = 3; // Gzip-compressed bitmap of revealed cells.
  repeated FlagGroup flagGroups = 4;
  // Per-chunk bomb density in [0,1]. The client must not recompute density.
  float density = 5;
}

// A batch of chunk syncs describing a rectangular region of the world.
message ChunkRegion {
  repeated ChunkSync chunks = 1;
}

// Sends multiple chunk states in a single compressed payload.
message ChunkRegionSync {
  // Top-left chunk coordinate covered by this region.
  ChunkID origin = 1;
  // Dimensions in chunk units.
  uint32 width = 2;
  uint32 height = 3;
  // Raw serialized `ChunkRegion` message (no internal gzip; outer Msg is gzipped).
  bytes chunks = 4;
}

// The server's authoritative response to a client's Reveal command.
message RevealAck {
  uint64 request_id = 1; // Mirrors the ID from the original Reveal request.
  bool ok = 2; // False only if the action was fundamentally invalid.

  // If ok=true, describes the specific, authoritative outcome for the primary chunk.
  // The client MUST use a switch on this `oneof` to determine the result.
  oneof outcome {
    // For reveals (chord, single cell, flood-fill, etc).
    RevealedCells revealed_cells = 3;
    // For a correct flag placement on a mine. Value is the cell index.
    FlagPlacement flagged_cell = 4;
  }

  // The resulting score change. Always sent if `ok` is true.
  ScoreUpdate score_update = 6;

  // The user's current global rank (1-based). Only sent if `ok` is true.
  uint32 user_rank = 7;
}

// Authoritative state update for a chunk, sent to all subscribers.
message ChunkUpdateBroadcast {
  ChunkID chunkId = 1;
  oneof update {
    RevealedCells revealed_cells = 2;
    FlagPlacement flagged_cell = 3;
  }
}

message FlagPlacement {
  uint32 cell = 1;
  uint32 flagID = 2;
}

message LeaderboardEntry {
  string name = 1;
  sint32 score = 2;
  uint32 flagID = 3;
}

message Leaderboard {
  uint64 version = 1;
  repeated LeaderboardEntry entries = 2;
}

// Response to Join message indicating success or failure
message JoinAck {
  bool ok = 1;
  string error = 2; // Set if ok=false, describes why join failed
  // If ok=true, provides the player's identity and session info
  string sessionToken = 3;
  string name = 4;
  sint32 score = 5;
  uint32 flagID = 6;
  ClientState newState = 7; // Should be PLAYER if ok=true
}

// Response to UpdateProfile message
message UpdateAck {
  bool ok = 1;
  string error = 2; // Set if ok=false, describes why update failed
  // Current profile values after update attempt
  string name = 3;
  uint32 flagID = 4;
  sint32 score = 5;
}

// Wrapper for all possible messages.
message Msg {
  oneof payload {
    // Client -> Server
    Subscribe subscribe = 2;
    Unsubscribe unsubscribe = 3;
    Reveal reveal = 4;
    ViewUpdate viewUpdate = 5;
    Join join = 17; // FSM: SPECTATOR -> PLAYER transition
    UpdateProfile updateProfile = 18; // FSM: Update profile while PLAYER

    // Server -> Client
    ChunkSync chunkSync = 7;
    RevealAck revealAck = 8;
    ChunkUpdateBroadcast chunkUpdateBroadcast = 9;
    Leaderboard leaderboard = 10;
    ChunkRegionSync chunkRegionSync = 11;
    JoinAck joinAck = 19; // FSM: Response to Join
    UpdateAck updateAck = 20; // FSM: Response to UpdateProfile

    // Minimap streaming (client -> server)
    SubscribeTiles minimapSubscribe = 12;
    UnsubscribeTiles minimapUnsubscribe = 13;
    ResendFull minimapResendFull = 14;

    // Minimap streaming (server -> client)
    FullTile minimapFullTile = 15;
    TileDelta minimapTileDelta = 16;
  }
}

// Minimap Streaming
// Fixed 64x64 tiles using 8-bit palette indices. Reliable & ordered.
message TileRef {
  sint32 x = 1; // chunk X
  sint32 y = 2; // chunk Y
}

// Client → Server
message SubscribeTiles { 
  repeated TileRef tiles = 1; 
  uint32 resolution = 2; // 16, 32, or 64 pixels per tile (defaults to 64)
}
message UnsubscribeTiles { repeated TileRef tiles = 1; }
message ResendFull { TileRef tile = 1; }

// Server → Client
message FullTile {
  TileRef tile = 1;
  uint32 version = 2; // monotonically increasing per tile
  bytes data = 3;     // resolution*resolution palette indices (raw)
  uint32 resolution = 4; // 16, 32, or 64 pixels per tile
}

message DeltaRect {
  uint32 x = 1; // 0..resolution-1
  uint32 y = 2; // 0..resolution-1
  uint32 w = 3; // 1..resolution
  uint32 h = 4; // 1..resolution
  bytes rows = 5; // concatenated rows of palette indices (no RLE initially)
}

message TileDelta {
  TileRef tile = 1;
  uint32 version = 2; // version AFTER applying this delta
  repeated DeltaRect rects = 3;
  uint32 resolution = 4; // 16, 32, or 64 pixels per tile
}
