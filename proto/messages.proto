syntax = "proto3";
package ms;
option go_package = "infinite-minesweeper/proto";

message ChunkID {
  // Variable-length signed chunk coordinates for a theoretically infinite board
  sint64 X = 1;
  sint64 Y = 2;
}

// Compact coordinate referencing a specific cell in a chunk. The cell field is
// a 12-bit value (0..4095) representing y*64 + x within the chunk.
message CellCoord {
  sint64 chunkX = 1;
  sint64 chunkY = 2;
  uint32 cell = 3; // 0..4095 index within the chunk
}

// Reveal a single cell specified using the compact CellCoord format.
message Reveal {
  CellCoord coord = 1;
  int32 playerId = 2;
}

// Flag placement encoded with CellCoord for compactness.
message Flag {
  CellCoord coord = 1;
  int32 playerId = 2;
  string color = 3;
}

message Hello {
  int32 playerId = 1;
  string name = 2;
  string color = 3;
  uint32 protocol = 4;
}

message Welcome {
  int32 playerId = 1;
  string name = 2;
  string color = 3;
  sint64 viewX = 4;
  sint64 viewY = 5;
}

message Subscribe {
  sint64 chunkX = 1;
  sint64 chunkY = 2;
}

message Unsubscribe {
  sint64 chunkX = 1;
  sint64 chunkY = 2;
}

message ChunkSync {
  ChunkID chunkId = 1;
  bytes seed = 2;  // 8‑byte little‑endian HMAC seed (exact 64 bits, JS‑safe).
  repeated Reveal reveals = 3;
  repeated Flag flags = 4;
}

message RevealAck { bool ok = 1; }
message FlagAck { bool ok = 1; }

message LeaderboardEntry {
  int32 playerId = 1;
  string name = 2;
  string score = 3;
}

message Leaderboard {
  uint64 version = 1;
  repeated LeaderboardEntry entries = 2;
}

message ScoreUpdate {
  int32 score = 1;
  sint64 worldX = 2;  // world X coordinate where the score change occurred
  sint64 worldY = 3;  // world Y coordinate where the score change occurred
  int32 delta = 4;   // score change amount (positive or negative)
}

message ViewUpdate {
  sint64 viewX = 1;
  sint64 viewY = 2;
}

message Msg {
  oneof payload {
    Hello hello = 1;
    Welcome welcome = 2;
    Reveal reveal = 3;
    Flag flag = 4;
    Subscribe subscribe = 5;
    Unsubscribe unsubscribe = 6;
    ChunkSync chunkSync = 7;
    RevealAck revealAck = 8;
    FlagAck flagAck = 9;
    Leaderboard leaderboard = 10;
    ScoreUpdate scoreUpdate = 11;
    ViewUpdate viewUpdate = 12;
  }
}
