syntax = "proto3";
package minesweeper;
option go_package = "infinite-minesweeper/pb;pb";

message ChunkID {
  int32 x = 1;
  int32 y = 2;
}

message Reveal {
  ChunkID chunk_id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 player_id = 4;
}

message Flag {
  ChunkID chunk_id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 player_id = 4;
  string color = 5;
}

message Hello {
  int32 player_id = 1;
  string name = 2;
  string color = 3;
}

message Welcome {
  int32 player_id = 1;
}

message RevealMessage {
  ChunkID chunk_id = 1;
  int32 x = 2;
  int32 y = 3;
}

message FlagMessage {
  ChunkID chunk_id = 1;
  int32 x = 2;
  int32 y = 3;
}

message Subscribe {
  ChunkID chunk_id = 1;
}

message Unsubscribe {
  ChunkID chunk_id = 1;
}

message ChunkSync {
  ChunkID chunk_id = 1;
  uint64 seed = 2;
  repeated Reveal reveals = 3;
  repeated Flag flags = 4;
}

message RevealAck { bool ok = 1; }
message FlagAck { bool ok = 1; }

message LeaderboardEntry {
  int32 player_id = 1;
  string name = 2;
  string score = 3;
}

message Leaderboard {
  uint64 version = 1;
  repeated LeaderboardEntry entries = 2;
}

message ScoreUpdate {
  int32 score = 1;
}

message Envelope {
  oneof msg {
    Hello hello = 1;
    Welcome welcome = 2;
    RevealMessage reveal = 3;
    RevealAck reveal_ack = 4;
    FlagMessage flag = 5;
    FlagAck flag_ack = 6;
    Subscribe subscribe = 7;
    Unsubscribe unsubscribe = 8;
    ChunkSync chunk_sync = 9;
    Leaderboard leaderboard = 10;
    Reveal broadcast_reveal = 11;
    Flag broadcast_flag = 12;
    ScoreUpdate score_update = 13;
  }
}
