# fly.toml app configuration file generated for infiniteminesweeper on 2025-07-29T04:26:55-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'infiniteminesweeper'
primary_region = 'ewr'
# Grace period between SIGINT and SIGKILL on stop — the shutdown handler
# needs time to flush the WAL and write a snapshot.
kill_timeout = '30s'

[build]

[env]
AWS_REGION = 'us-east-1'
S3_BUCKET_NAME = ''
DATA_DIR = '/data'
PORT = '8080'
MODE = 'production'
METRICS_PORT = '9091'

# Prometheus scrape target — fly's internal collector hits this and surfaces
# the metrics in fly-metrics.net Grafana. Set up alerts there with:
#   go_goroutines > 500
#   go_memstats_sys_bytes > 200 * 1024 * 1024     (or fly_instance_memory_mem_used)
[[metrics]]
port = 9091
path = '/metrics'

[[mounts]]
source = 'storage'
destination = '/data'
processes = ['app']

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
# Keep the single machine always on: no cold starts, and no stop/start
# cycles that risk losing buffered WAL entries on hard kills.
min_machines_running = 1
processes = ['app']

[[vm]]
size = 'shared-cpu-1x'
# The merged world idles at ~95MB heap and the periodic snapshot deep-copies
# all state; 256MB left no headroom and GC-death-spiraled the machine.
memory = '512mb'
