<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Mine icon design based on classic minesweeper mine -->
  <circle cx="8" cy="8" r="4" fill="#333"/>
  
  <!-- Spikes around the mine -->
  <rect x="7.5" y="1" width="1" height="3" fill="#333"/>
  <rect x="7.5" y="12" width="1" height="3" fill="#333"/>
  <rect x="1" y="7.5" width="3" height="1" fill="#333"/>
  <rect x="12" y="7.5" width="3" height="1" fill="#333"/>
  
  <!-- Diagonal spikes -->
  <rect x="3.5" y="3.5" width="2" height="1" fill="#333" transform="rotate(45 4.5 4)"/>
  <rect x="10.5" y="3.5" width="2" height="1" fill="#333" transform="rotate(-45 11.5 4)"/>
  <rect x="3.5" y="11.5" width="2" height="1" fill="#333" transform="rotate(-45 4.5 12)"/>
  <rect x="10.5" y="11.5" width="2" height="1" fill="#333" transform="rotate(45 11.5 12)"/>
</svg>