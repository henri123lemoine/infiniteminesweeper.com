    category: 'flag'
    shape: 'guidon'
    wavy: true
    cost: 50

  flag6:
    name: 'Very Wavy Triangle Flag'
    category: 'flag'
    shape: 'triangle'
    wavy: true
    cost: 120

  flag7:
