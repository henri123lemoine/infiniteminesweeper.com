  flag12:
    name: 'Broken Rectangle Flag'
    category: 'flag'
    shape: 'rectangle'
    broken: true
    cost: 1000

  flag13:
    name: 'Broken Guidon Flag'
    category: 'flag'
    shape: 'guidon'
    broken: true
    cost: 1500

  flag14:
    name: 'Black Down Guidon Flag'
    category: 'flag'
    pointing: 'down'
