# Sprite configuration with category-based defaults
# Categories automatically get appropriate defaults from CATEGORY_DEFAULTS

sprites:
  # Mines
  mine:
    name: 'Mine'
    category: 'mine'

  # Basic flags - minimal config needed due to category defaults
  flag0:
    name: 'Rectangle Flag'
    category: 'flag'
    shape: 'rectangle'
    cost: 5

  flag1:
    name: 'Triangle Flag'
    category: 'flag'
    shape: 'triangle'
    cost: 5

  flag2:
    name: 'Guidon Flag'
    category: 'flag'
    shape: 'guidon'
    cost: 5

  flag3:
    name: 'Wavy Rectangle Flag'
    category: 'flag'
    shape: 'rectangle'
    wavy: true
    cost: 50

  flag4:
    name: 'Wavy Triangle Flag'
    category: 'flag'
    shape: 'triangle'
    wavy: true
    cost: 30

  flag5:
